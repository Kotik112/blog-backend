name: Deploy to AWS Elastic Beanstalk (DEV)
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # 📥 Checkout code
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ☕ Setup Java
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # 🔐 Set wrapper permissions
      - name: 🔐 Change wrapper permissions
        run: chmod +x ./mvnw

      # 📦 Cache Maven dependencies
      - name: 📦 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # 🧪 Run tests
      - name: 🧪 Test with Maven (skipped)
        if: false # Set to false to speed up the workflow while testing deployment
        run: ./mvnw clean test -DskipTests=false -Pci

      # 🏗️ Build JAR for deployment
      - name: 🏗️ Build JAR (for deployment)
        run: ./mvnw clean package -DskipTests -Pci

      # 📦 Create deployment zip for Elastic Beanstalk
      - name: 📦 Create zip for Elastic Beanstalk
        run: |
          mkdir -p staging/.ebextensions
          cp target/*.jar staging/application.jar

          echo 'web: java -jar application.jar' > staging/Procfile

          {
            echo "option_settings:"
            echo "  aws:elasticbeanstalk:application:environment:"
            echo "    SPRING_PROFILES_ACTIVE: dev"
            echo "    DB_URL: \"${DB_URL}\""
            echo "    DB_USER: \"${DB_USER}\""
            echo "    DB_PW: \"${DB_PW}\""
            echo "    SPRING_MAIL_HOST: \"${SPRING_MAIL_HOST}\""
            echo "    SPRING_MAIL_PORT: \"${SPRING_MAIL_PORT}\""
            echo "    SPRING_MAIL_USERNAME: \"${MAIL_USERNAME}\""
            echo "    SPRING_MAIL_PASSWORD: \"${MAIL_PASSWORD}\""
            echo "    SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: \"${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}\""
            echo "    SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: \"${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}\""
            echo "    MAIL_TO: \"${MAIL_TO}\""
          } > staging/.ebextensions/01_environment.config

          cd staging
          zip -r ../deploy.zip .
          cd ..
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PW: ${{ secrets.DB_PW }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH }}
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      # 🚀 Deploy to AWS Elastic Beanstalk
      - name: 🚀 Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          version_label: v-${{ github.run_number }}-${{ github.run_attempt }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: deploy.zip