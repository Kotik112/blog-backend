name: Deploy to AWS Elastic Beanstalk (DEV)
on:
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 📥 Checkout code
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ☕ Setup Java
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # 🔐 Set wrapper permissions
      - name: 🔐 Change wrapper permissions
        run: chmod +x ./mvnw

      # 📦 Cache Maven dependencies
      - name: 📦 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # 🧪 Run tests (optional)
      - name: 🧪 Test with Maven (skipped)
        if: false
        run: ./mvnw clean test -DskipTests=false -Pci

      # 🏗️ Build JAR
      - name: 🏗️ Build JAR
        run: ./mvnw clean package -DskipTests -Pci

      # 📦 Create deployment zip
      - name: 📦 Create deployment ZIP
        run: |
          # 🔐 Create .env file for envsubst
          cat <<EOF > .env
          DB_URL=${{ secrets.DB_URL }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PW=${{ secrets.DB_PW }}
          SPRING_MAIL_HOST=${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT=${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH }}
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE }}
          MAIL_TO=${{ secrets.MAIL_TO }}
          EOF

          set -o allexport
          source .env
          mkdir -p staging/.ebextensions
          envsubst < .github/eb_env.template > staging/.ebextensions/01_environment.config
          set +o allexport

          cp target/*.jar staging/application.jar
          echo 'web: java -jar application.jar --spring.profiles.active=dev' > staging/Procfile

          cd staging
          zip -r ../deploy.zip .
          cd ..

      # 🚀 Deploy to EB
      - name: 🚀 Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          version_label: v-${{ github.run_number }}-${{ github.run_attempt }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: deploy.zip
